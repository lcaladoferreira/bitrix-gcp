name: CI
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install ruff pytest pytest-mock
      - name: Ruff
        run: ruff check .
      - name: Compile
        run: python -m compileall src/bitrix_gcp/
      - name: Test
        env:
          GCP_PROJECT_ID: test
          BITRIX_WEBHOOK_URL: http://test
          GCS_BUCKET: test
          PYTHONPATH: src
        run: pytest
      - name: Docker
        run: docker build -t test .
